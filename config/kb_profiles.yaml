# 知識庫編譯設定：每個 profile 是一組要編譯的來源。所有來源都取自 Methodist 文件夾。
# Knowledge-base build profiles. Every source comes from the Methodist folder (source_dir).
#
# 來源的寫法 / how to write a source:
#   file:     Methodist 文件夾（含 Global_base、HK 等子文件夾）裡的檔名；同名檔案在兩個子文件夾時寫成 HK/檔名
#   pages:    只取 PDF 的這些頁，例如 "1503-1530"
#   outline:  只取 PDF 書籤標題含這段文字的部分，例如 羅馬書（先用 outline 指令查看書籤）
#   to_text:  把（截取後的）PDF 轉成純文字 .md 再編譯
#   s2t:      把簡體字轉成繁體（文字檔，或 to_text 之後）
#   name:     放進 inputs/ 時的檔名（預設沿用原檔名）。這份副本在 knowledge/<輸出名>/inputs/，原檔不會被改動
#   wesley_nt_notes: true   衛斯理新約註釋，取自 03 號 PDF 解析出的 data/wesley_nt.json，每卷書一個檔
#
# 編譯模型在 config/llm.yaml 的 compile 角色設定（某個 profile 也可以寫自己的 model:）。
# 編譯模型與 wiki 語言可在指令列用 --model / --language 覆寫；輸出到 knowledge/<profile>.<language>.<model>/。

source_dir: E:/DESK/theoclaw/Methodist

defaults:
  language: en          # en 或 zh-Hant

profiles:
  smoke:
    description: 試跑：總規中文版（轉繁體），幾乎不花錢，用來確認 OpenKB 與模型設定可用
    model: qwen3.8-flash   # 只測流程，用便宜的模型
    sources:
      - {file: 06_The_General_Rules_Bilingual_Wesley_1743.md, s2t: true, name: 總規-中文.md}

  general-rules-en:
    description: 總規英文原文；和 general-rules-zh 是同一份文件的兩種語言（來源語言對照）
    sources:
      - {file: 08_John_Wesley_The_General_Rules_1743_text.pdf, name: general-rules-1743-en.pdf}

  general-rules-zh:
    description: 總規中文版（轉繁體），和 general-rules-en 對照；中文版是摘要加英文引文，不是逐句翻譯
    sources:
      - {file: 06_The_General_Rules_Bilingual_Wesley_1743.md, s2t: true, name: 總規-中文.md}

  wesley-core:
    description: 衛斯理新約註釋、基督徒完全論、總規、循道衛理宗教條款
    sources:
      - {wesley_nt_notes: true}
      - {file: 02_John_Wesley_Plain_Account_of_Christian_Perfection.pdf, name: plain-account-of-christian-perfection.pdf}
      - {file: 08_John_Wesley_The_General_Rules_1743_text.pdf, name: general-rules-1743-en.pdf}
      - {file: 09_United_Methodist_Articles_of_Religion_text.pdf, name: articles-of-religion.pdf}

  plain-account:
    description: 只有《基督徒完全論》（約 3.5 萬詞），用來比較 OpenKB 編譯與傳統 RAG（預算小，轉成純文字再編）
    sources:
      - {file: 02_John_Wesley_Plain_Account_of_Christian_Perfection.pdf, to_text: true, name: plain-account-of-christian-perfection.pdf}

  plain-account-pdf:
    description: 同一本《基督徒完全論》，直接用 PDF 編譯（75 頁，超過 20 頁走 PageIndex 分頁目錄）；補測編譯本身，對照 plain-account（轉成純文字、被當作短文件）
    sources:
      - {file: 02_John_Wesley_Plain_Account_of_Christian_Perfection.pdf, name: plain-account-of-christian-perfection.pdf}

  methodist:
    description: 正式的循道衛理知識庫（牧者模式）。分階段編：第一階段只有標準講道集；之後在這裡加來源再執行同一個 build，只會編新加的檔案。
    sources:
      - {file: 01_John_Wesley_Standard_Sermons.pdf, name: standard-sermons.pdf}
      # 第二階段
      - {file: 02_John_Wesley_Plain_Account_of_Christian_Perfection.pdf, name: plain-account-of-christian-perfection.pdf}
      - {file: 04_John_Wesley_The_Journal_of_John_Wesley.pdf, name: wesley-journal.pdf}
      # 聖詩集不編譯：掃描檔沒有目錄，PageIndex 建索引很貴（試編花了 $1.21 仍未完成）。改用程式按「HYMN n.」切分、只供檢索：
      #   python -m theoclaw.kb.hymns build <這個 PDF> --kb methodist.en.deepseek-flash
      # - {file: 05_Charles_Wesley_Collection_of_Hymns_for_the_Use_of_the_People_Called_Methodists.pdf, name: wesley-hymns-1780.pdf}
      - {file: 08_John_Wesley_The_General_Rules_1743_text.pdf, name: general-rules-1743-en.pdf}
      - {file: 09_United_Methodist_Articles_of_Religion_text.pdf, name: articles-of-religion.pdf}
      - {file: 06_The_General_Rules_Bilingual_Wesley_1743.md, s2t: true, name: 總規-中文.md}
      - {file: 01 我為何要信？.pdf, name: 課程01-我為何要信.pdf}
      - {file: 02 我信上帝（學員版）.pdf, name: 課程02-我信上帝.pdf}
      - {file: 03 我信主耶穌基督（一）.pdf, name: 課程03-我信主耶穌基督一.pdf}
      - {file: 04 我信主耶穌基督（2）十架與復活.pdf, name: 課程04-十架與復活.pdf}
      - {file: 05 我信聖靈（1） 聖靈位格  成聖生活.pdf, name: 課程05-聖靈位格與成聖生活.pdf}
      - {file: 06 我信聖靈（2）.pdf, name: 課程06-我信聖靈二.pdf}
      - {file: 屬靈恩賜.pdf}

  wesley-sermons:
    description: 衛斯理標準講道（1,281 頁，費用最高，最後再編）
    sources:
      - {file: 01_John_Wesley_Standard_Sermons.pdf, name: standard-sermons.pdf}

  zh-course:
    description: 中文信仰課程教材（中文來源；dry run 顯示字數為 0 的檔案是掃描檔，需要先做文字辨識）
    sources:
      - {file: 01 我為何要信？.pdf, name: 課程01-我為何要信.pdf}
      - {file: 02 我信上帝（學員版）.pdf, name: 課程02-我信上帝.pdf}
      - {file: 03 我信主耶穌基督（一）.pdf, name: 課程03-我信主耶穌基督一.pdf}
      - {file: 04 我信主耶穌基督（2）十架與復活.pdf, name: 課程04-十架與復活.pdf}
      - {file: 05 我信聖靈（1） 聖靈位格  成聖生活.pdf, name: 課程05-聖靈位格與成聖生活.pdf}
      - {file: 06 我信聖靈（2）.pdf, name: 課程06-我信聖靈二.pdf}
      - {file: 屬靈恩賜.pdf}

  bible-cuv-romans:
    description: 新標點和合本（繁體）羅馬書；先用 outline 指令確認書籤名稱，沒有書籤就改用 pages
    sources:
      - {file: 00_聖經_新標點和合本_繁體_全文_公版.pdf, outline: 羅馬書, name: 和合本-羅馬書.pdf}

  background:
    description: 背景資料：衛斯理日記、自由循道會 2019 年紀律書（只作背景，不代表本會立場）
    sources:
      - {file: 04_John_Wesley_The_Journal_of_John_Wesley.pdf, name: wesley-journal.pdf}
      - {file: 07_Free_Methodist_Church_Book_of_Discipline_2019.pdf, name: free-methodist-discipline-2019.pdf}

  # ── 其他宗派（來源在 E:/DESK/theoclaw/Denominations/<宗派>，都是公有領域；清單與授權見各資料夾的 SOURCES.md）
  # 一律用文字版 PDF、按頁編譯（20 頁以上走 PageIndex，和標準講道集一樣），不把整份純文字當一份文件編。
  # pdf/ 裡 CCEL 的 PDF 是原有的文字版（有目錄）；其他是用 scripts/md_to_pdf.py 從公有領域純文字排成的
  # 文字版 PDF（第一頁印目錄、每頁印頁碼、附書籤），不是掃描圖片。
  # 篇幅大、或只有文字辨識稿而沒有像樣目錄的著作 search_only：不編譯，放進 wiki/library/ 只供 rag_search 檢索，不花錢。
  lutheran:
    description: 信義宗（路德宗）知識庫：協同書（Triglot Concordia 1921 英譯）與路德《宗教改革的首要原則》（1883 英譯）
    model: deepseek-flash
    source_dir: E:/DESK/theoclaw/Denominations/Lutheran
    sources:
      - {file: pdf/01_augsburg_confession.pdf, name: augsburg-confession.pdf}
      - {file: pdf/02_apology_of_the_augsburg_confession.pdf, name: apology-of-the-augsburg-confession.pdf}
      - {file: pdf/03_smalcald_articles.pdf, name: smalcald-articles.pdf}
      - {file: pdf/04_treatise_on_the_power_and_primacy_of_the_pope.pdf, name: treatise-on-the-power-and-primacy-of-the-pope.pdf}
      - {file: pdf/05_small_catechism.pdf, name: small-catechism.pdf}
      - {file: pdf/largecatechism.pdf, name: large-catechism.pdf}
      - {file: pdf/07_formula_of_concord_epitome.pdf, name: formula-of-concord-epitome.pdf}
      - {file: pdf/first_prin.pdf, name: luther-first-principles-95-theses-christian-liberty.pdf}
      - {file: 08_formula_of_concord_solid_declaration.md, search_only: true, name: formula-of-concord-solid-declaration.md}
      - {file: 12_luther_bondage_of_the_will.md, search_only: true, name: luther-bondage-of-the-will.md}
      # 加拉太書註釋（Gutenberg #1549、CCEL）都是 Graebner 1939 年的節譯本，不確定是公有領域，不用；
      # CCEL 的小要理問答是 2002 年的新譯本，不用（改用 Triglot 1921 譯本）

  baptist:
    description: 浸信會知識庫：1689 年倫敦浸信會信條、基奇要理問答、新罕布什爾信條、司布真《全是恩典》；司布真講道集與富勒只供檢索
    model: deepseek-flash
    source_dir: E:/DESK/theoclaw/Denominations/Baptist
    sources:
      - {file: pdf/01_second_london_baptist_confession_1689.pdf, name: second-london-baptist-confession-1689.pdf}
      - {file: pdf/02_keach_baptist_catechism.pdf, name: keach-baptist-catechism.pdf}
      - {file: pdf/03_new_hampshire_confession_1833.pdf, name: new-hampshire-confession-1833.pdf}
      - {file: pdf/grace.pdf, name: spurgeon-all-of-grace.pdf}
      - {file: 05_spurgeon_sermons_vol01_1855.md, search_only: true, name: spurgeon-sermons-1855.md}
      - {file: 06_fuller_gospel_worthy_of_all_acceptation.md, search_only: true, name: fuller-gospel-worthy-of-all-acceptation.md}

  anglican:
    description: 聖公會知識庫：三十九條、1928 年美國公禱書（主要禮文）、朱厄爾《英格蘭教會辯護》；講道集與胡克只供檢索
    model: deepseek-flash
    source_dir: E:/DESK/theoclaw/Denominations/Anglican
    sources:
      - {file: pdf/01_thirty_nine_articles_1571.pdf, name: thirty-nine-articles.pdf}
      - {file: pdf/03_book_of_common_prayer_1928_us_core.pdf, name: book-of-common-prayer-1928.pdf}
      - {file: pdf/05_jewel_apology_of_the_church_of_england.pdf, name: jewel-apology-of-the-church-of-england.pdf}
      - {file: 02_books_of_homilies.md, search_only: true, name: books-of-homilies.md}
      - {file: 04_hooker_laws_of_ecclesiastical_polity_selection.md, search_only: true, name: hooker-laws-of-ecclesiastical-polity.md}
