# 平信徒常見問題：比較「不用知識庫」與「用循道衛理知識庫（講道集、日記、聖詩、規章、中文課程、完全論）」。
#   不用：python -m theoclaw.evals run --tasks tasks/lay_methodist.yaml --tools scripture,wesley --n 1
#   用：  python -m theoclaw.evals run --tasks tasks/lay_methodist.yaml --tools scripture,wesley,kb,rag --kb methodist.en.deepseek-flash --n 1
# 題目是查經班成員可能會問的；category 標出最可能用到的資料。

- id: lay-assurance
  category: sermons
  prompt: 我怎樣知道自己真的得救了？衛斯理說的「聖靈的見證」是甚麼意思？
  graders: []

